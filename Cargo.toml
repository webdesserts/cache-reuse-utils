[package]
name = "cache-reuse-utils"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Bounded suffix-cache-reuse discovery and plan selection"

# One workspace: the safe core is the default member; the FFI is explicit.
[workspace]
members = [".", "ffi"]
default-members = ["."]
resolver = "3"

[dependencies]
mock_instant = { version = "=0.6.1", optional = true }

[features]
test-support = ["dep:mock_instant"]

[profile.release]
panic = "unwind"

[[test]]
name = "test_support_clock"
path = "tests/test_support_clock.rs"
required-features = ["test-support"]
