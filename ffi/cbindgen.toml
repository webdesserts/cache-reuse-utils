language = "C"
style = "type"
include_guard = "CACHE_REUSE_UTILS_H"
cpp_compat = true
usize_is_size_t = true
documentation = false
include_version = false

[export]
item_types = ["constants", "structs", "functions"]
renaming_overrides_prefixing = true

[export.rename]
ScrPlannerRange = "scr_planner_range"
ScrPlannerInsertion = "scr_planner_insertion"
ScrPlannerConfig = "scr_planner_config"
ScrPlannerResult = "scr_planner_result"
