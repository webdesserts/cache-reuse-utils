language = "C"
style = "type"
include_guard = "CACHE_REUSE_UTILS_H"
cpp_compat = true
usize_is_size_t = true
documentation = false
include_version = false

[export]
item_types = ["constants", "structs", "functions"]
renaming_overrides_prefixing = true

[export.rename]
CacheReuseRange = "cache_reuse_range"
CacheReuseInsertion = "cache_reuse_insertion"
CacheReuseConfig = "cache_reuse_config"
CacheReuseResult = "cache_reuse_result"
